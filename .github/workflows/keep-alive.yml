name: 剧集猎人 · 保活守护

# 每 7 分钟巡检一次：
#   1) 访问一次云主机端口 → 刷新 Codespaces 的空闲计时器（无需令牌）
#   2) 云主机已被回收 → 用仓库 Secret 里的 PAT 重新拉起
#   3) 容器里的应用进程挂了 → SSH 进去重启（需要 PAT）
#
# ⚠️ 若要自动拉起/重启，请在仓库 Settings → Secrets and variables → Actions
#    新增仓库 Secret：名称 GH_PAT，值 = 你的 Personal Access Token
#    （需包含 codespace 权限；不含时第 1 步仍会尽力保活）
on:
  schedule:
    - cron: '*/7 * * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: series-hunter-keepalive
  cancel-in-progress: true

env:
  CODESPACE: upgraded-space-lamp-q7gr4694xg6pf4x5v
  PORT: 8787
  GH_PAT: ${{ secrets.GH_PAT }}

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 刷新空闲计时器（无需令牌）
        run: |
          url="https://${CODESPACE}-${PORT}.app.github.dev/"
          code=$(curl -s -o /dev/null -m 25 -w "%{http_code}" "$url" || echo 000)
          echo "端口 ${url} → ${code}"
          if [ "${code}" = "404" ] || [ "${code}" = "000" ]; then
            echo "::warning::云主机可能已停止，需要用 PAT 拉起"
          fi

      - name: 检查并拉起 Codespaces
        if: env.GH_PAT != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          # 注意：API 返回的状态是首字母大写（Available），统一转小写再比较
          state=$(gh api "user/codespaces/${CODESPACE}" --jq .state 2>/dev/null | tr 'A-Z' 'a-z' || echo unknown)
          state="${state:-unknown}"
          echo "当前状态: ${state}"
          if [ "${state}" != "available" ]; then
            echo ">>> 正在启动 Codespaces…"
            gh api -X POST "user/codespaces/${CODESPACE}/start" || true
            for i in $(seq 1 24); do
              sleep 15
              state=$(gh api "user/codespaces/${CODESPACE}" --jq .state 2>/dev/null | tr 'A-Z' 'a-z' || echo unknown)
              state="${state:-unknown}"
              echo "    [$i] ${state}"
              [ "${state}" = "available" ] && break
            done
          fi

      - name: 确保应用进程存活
        if: env.GH_PAT != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set +e
          diag=$(gh codespace ssh -c "${CODESPACE}" -- \
            'bash -lc "cd /workspaces/series-hunter; echo ===PROCS===; pgrep -af \"node server/index.js\" || echo NO_NODE; echo ===PORT===; (ss -ltnp 2>/dev/null || netstat -ltnp 2>/dev/null) | grep 8787 || echo NO_PORT; echo ===LOG===; tail -n 12 /tmp/series-hunter.log 2>/dev/null || echo NO_LOG; echo ===WS===; pwd; ls -d vendor 2>/dev/null || echo NO_VENDOR"' 2>&1)
          echo "${diag}"
          if ! echo "${diag}" | grep -q "===PROCS==="; then
            echo ">>> SSH 不可用，先尝试用 API 重新拉起实例"
            gh api -X POST "user/codespaces/${CODESPACE}/stop" >/dev/null 2>&1
            sleep 20
            gh api -X POST "user/codespaces/${CODESPACE}/start" >/dev/null 2>&1
          fi
          exit 0

      - name: 回传诊断到主控
        if: always() && env.GH_PAT != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set +e
          peer_api=$(grep -o "apiBase: '[^']*'" "$GITHUB_WORKSPACE/web/config.js" 2>/dev/null | head -1 | sed "s/apiBase: '//; s/'$//")
          [ -z "${peer_api}" ] && { echo "未找到主控地址，跳过回传"; exit 0; }
          diag=$(gh codespace ssh -c "${CODESPACE}" -- 'bash -lc "cd /workspaces/series-hunter; echo PROCS; pgrep -af "node server/index.js" || echo NO_NODE; echo PORT; (ss -ltn 2>/dev/null||netstat -ltn 2>/dev/null)|grep 8787||echo NO_PORT; echo LOG; tail -n 15 /tmp/series-hunter.log 2>/dev/null||echo NO_LOG"' 2>&1 | tr '\n' ' ')
          curl -s -m 20 -G --data-urlencode "from=github-actions" --data-urlencode "diag=${diag:0:1200}" \
            "${peer_api}/api/heartbeat" || true
          exit 0

      - name: 汇总
        run: |
          if [ -z "${GH_PAT}" ]; then
            echo "::warning::未配置 Secret GH_PAT —— 只能刷新空闲计时器，无法自动拉起/重启"
          fi
          echo "✅ 巡检完成 —— ${CODESPACE} 端口 ${PORT}"
          echo "   应用地址: https://${CODESPACE}-${PORT}.app.github.dev"
          if [ -z "${GH_PAT}" ]; then
            echo "   ℹ️ 未配置 Secret GH_PAT：当前只能保活，无法自动拉起已停止的实例"
          fi
